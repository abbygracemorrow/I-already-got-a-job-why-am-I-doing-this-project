name: Daily run

on:
  schedule:
    - cron: "23 12 * * *"   # every day at 12:23 UTC (6:23 am Dallas time)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write   # to start the Tests workflow on the new data commit

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sources, build history, write status, open issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Job aggregator keys (optional). A source whose key is not set is left out of the run.
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m watcher run

      - name: Commit raw files, history and status
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Daily run $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1
        id: commit

      - name: Run the tests on the new data commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run tests.yml --ref main --repo "$GITHUB_REPOSITORY"

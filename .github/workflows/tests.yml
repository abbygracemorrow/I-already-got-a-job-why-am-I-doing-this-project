name: Tests

on:
  push:
  pull_request:
  # The daily run starts this after it pushes its data commit, because pushes made
  # with the workflow's own token do not start other workflows on their own.
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
